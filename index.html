<!<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afruza | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --dark: #0f0c29;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px 25px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* Qiz bola avatar stili */
        .avatar-box {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            background: #fff;
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 0 20px var(--primary);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        h1 { font-size: 1.6rem; margin: 10px 0; }
        .tag { color: var(--secondary); font-size: 0.85rem; margin-bottom: 20px; display: block; }

        .about { font-size: 0.9rem; line-height: 1.6; opacity: 0.8; margin-bottom: 25px; }

        .btn-group { display: flex; flex-direction: column; gap: 12px; }

        .btn {
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--primary);
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-box">
            <img src="https://img.freepik.com/free-vector/young-woman-with-glasses-avatar-character_24877-54441.jpg" alt="Avatar">
        </div>
        
        <h1>Afruza Vahobjon qizi</h1>
        <span class="tag">Qarshi Davlat Universiteti | ATT talabasi</span>

        <p class="about">
            Men veb-dasturlashga qiziquvchi, kelajakda o'z sohasining yetuk mutaxassisi bo'lishni maqsad qilgan talabaman.
        </p>

        <div class="btn-group">
            <a href="https://t.me/afruza_user" class="btn">Telegram</a>
            <a href="mailto:afruzaraxmonova7@gmail.com" class="btn">Email</a>
            <a href="https://github.com/afruzaraxmonova7-spec" class="btn">GitHub</a>
        </div>
    </div>

</body>
</html>
