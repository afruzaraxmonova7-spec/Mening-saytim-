<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afruza Vahobjon qizi | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #ff7eb3 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            min-height: 100vh;
        }

        .card {
            background: white;
            border-radius: 30px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* Profil bo'limi */
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 5px solid #f8f9fa;
            object-fit: cover;
        }

        h1 { font-size: 22px; color: #333; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #777; margin-bottom: 20px; }

        .social-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .s-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #7d5fff;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .s-btn:hover { transform: scale(1.1); }

        /* Ma'lumot va Ko'nikma */
        .title {
            text-align: left;
            font-size: 16px;
            font-weight: 600;
            color: #4b0082;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .box {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            text-align: left;
            font-size: 14px;
        }

        .skill-bar {
            text-align: left;
            margin-bottom: 15px;
        }

        .bar-bg {
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-top: 5px;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #7d5fff, #ff7eb3);
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://img.freepik.com/free-vector/young-woman-with-glasses-avatar-character_24877-54441.jpg" class="avatar" alt="Afruza">
        <h1>Afruza Vahobjon qizi</h1>
        <p class="subtitle">Qarshi davlat universiteti talabasi</p>
        <div class="social-btns">
            <a href="https://t.me/afruza_user" class="s-btn"><i class="fab fa-telegram"></i></a>
            <a href="mailto:afruzaraxmonova7@gmail.com" class="s-btn"><i class="fas fa-envelope"></i></a>
            <a href="#" class="s-btn"><i class="fab fa-instagram"></i></a>
        </div>
    </div>

    <div class="card">
        <div class="title"><i class="fas fa-graduation-cap"></i> Ma'lumot</div>
        <div class="box"><b>Fakultet:</b> Matematika va kompyuter ilmlari (ATT)</div>
        <div class="box"><b>Maqsad:</b> IT mutaxassisi bo'lish</div>
    </div>

    <div class="card">
        <div class="title"><i class="fas fa-star"></i> Ko'nikmalar</div>
        <div class="skill-bar">
            <span>HTML/CSS</span>
            <div class="bar-bg"><div class="bar-fill" style="width: 80%;"></div></div>
        </div>
        <div class="skill-bar">
            <span>Dizayn</span>
            <div class="bar-bg"><div class="bar-fill" style="width: 70%;"></div></div>
        </div>
    </div>

</body>
</html>
