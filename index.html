<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afruza Vahobjon qizi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #1a1a3d; /* To'q binafsha fon */
            background: linear-gradient(180deg, #1a1a3d 0%, #0d0d21 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 20px;
        }

        /* Avatar qismi */
        .avatar-wrapper {
            width: 130px;
            height: 130px;
            margin: 0 auto 25px;
            position: relative;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #7d5fff;
            box-shadow: 0 0 20px rgba(125, 95, 255, 0.6);
            object-fit: cover;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .university {
            font-size: 14px;
            color: #a29bfe;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .description {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.8;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        /* Tugmalar stili */
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 400;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(125, 95, 255, 0.2);
            border-color: #7d5fff;
            transform: translateY(-2px);
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-wrapper">
            <img src="https://img.freepik.com/free-vector/young-woman-with-glasses-avatar-character_24877-54441.jpg" alt="Avatar">
        </div>

        <h1>Afruza Vahobjon qizi</h1>
        <p class="university">Qarshi Davlat Universiteti | ATT talabasi</p>

        <p class="description">
            Men ATT mutaxassisi, kelajakda o'z sohasining yetuk mutaxassisi bo'lishni maqsad qilgan talabaman.
        </p>

        <div class="links">
            <a href="https://t.me/afruza_user" class="btn">Telegram</a>
            <a href="mailto:afruzaraxmonova7@gmail.com" class="btn">Email</a>
        </div>
    </div>

</body>
</html>
